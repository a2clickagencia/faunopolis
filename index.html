<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faunópolis</title>
<meta name="description" content="Faunópolis — construa, cuide e faça crescer o seu zoológico. Jogo de simulação e gestão em 2D e 3D.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F6B4A">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css?v=7110">
</head>
<body data-tool="select">
<canvas id="game3d" style="display:none"></canvas>
<canvas id="game"></canvas>

<!-- ============ MENU PRINCIPAL ============ -->
<div id="menu">
  <div class="menu-bg">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  </div>
  <div class="menu-card">
    <img src="assets/brand/logo-negativo.svg" alt="Faunópolis" class="menu-logo">
    <p class="menu-sub">O zoológico que você sempre quis — construa, cuide e cresça sem perder o controle.</p>
    <div class="menu-buttons">
      <button class="btn big primary" id="menu-new">🏆 Nova carreira</button>
      <button class="btn big" id="menu-free">🌿 Modo livre</button>
      <button class="btn big" id="menu-continue">▶ Continuar<small id="menu-continue-sub"></small></button>
      <button class="btn big" id="menu-load">📂 Carregar jogo</button>
      <div class="menu-row">
        <button class="btn" id="menu-help">❓ Como jogar</button>
        <a class="btn" href="docs/MANUAL_DO_JOGO.html" target="_blank">📖 Manual</a>
        <button class="btn" id="menu-credits">✨ Créditos</button>
      </div>
      <a class="btn" id="menu-download" href="https://github.com/a2clickagencia/faunopolis/releases/download/v7.1.0/Faunopolis-Setup-7.1.0.exe" download="Faunopolis-Setup-7.1.0.exe" style="display:none">💻 Baixar para Windows (salvar no seu PC)</a>
    </div>
    <p class="menu-ver">v7.1.0 · 64 espécies · 9 brinquedos · lagos nos recintos · 2D e 3D em alta qualidade</p>
  </div>
</div>

<!-- ============ HUD ============ -->
<div id="hud" class="hidden">
  <header id="topbar">
    <img src="assets/brand/logo-simbolo.svg" class="tb-logo" alt="">
    <div class="tb-item money"><span class="lbl">Saldo</span><b id="t-money">R$ 0</b><small id="t-net"></small></div>
    <div class="tb-item"><span class="lbl">Visitantes</span><b id="t-vis">0</b><small id="t-vis-sub"></small></div>
    <div class="tb-item"><span class="lbl">Avaliação</span><b id="t-rep" class="stars"></b><small id="t-rep-sub"></small></div>
    <div class="tb-item"><span class="lbl">Satisfação</span><b id="t-sat">—</b></div>
    <div class="tb-item"><span class="lbl">Bem-estar</span><b id="t-wel">—</b></div>
    <div class="tb-spacer"><small id="t-stage"></small><small id="t-event"></small></div>
    <div class="tb-item time"><b id="t-time">07:00</b><small id="t-date"></small></div>
    <div id="speed">
      <button data-speed="pause" title="Pausar (Espaço)">⏸</button>
      <button data-speed="1" title="1× (tecla 1)">▶</button>
      <button data-speed="2" title="2× (tecla 2)">▶▶</button>
      <button data-speed="4" title="4× (tecla 3)">⏩</button>
      <button data-speed="8" title="8× (tecla 4)">⏭</button>
    </div>
    <button id="btn-menu" title="Menu">☰</button>
  </header>

  <nav id="buildbar"></nav>
  <div id="flyout" class="hidden"></div>
  <div id="toolhint" class="hidden"></div>

  <aside id="panel" class="hidden">
    <div class="p-head"><div class="p-title"></div><button class="p-close" title="Fechar (Esc)">×</button></div>
    <div class="p-body"></div>
  </aside>

  <nav id="mgmtbar"></nav>
  <div id="feed"></div>

  <div id="mapbox">
    <div id="lenses">
      <button data-lens="normal" title="Visão normal">👁️</button>
      <button data-lens="bemestar" title="Lente: bem-estar">💚</button>
      <button data-lens="limpeza" title="Lente: limpeza">🧹</button>
      <button data-lens="saude" title="Lente: saúde">➕</button>
      <button data-lens="habitat" title="Lente: habitat">🌿</button>
      <button data-lens="lotacao" title="Lente: lotação">👥</button>
    </div>
    <canvas id="minimap" width="216" height="162"></canvas>
    <div id="cambar"></div>
  </div>
</div>

<div id="tooltip" class="hidden"></div>
<div id="toasts"></div>
<div id="modal" class="hidden"><div class="modal-box"></div></div>

<script src="js/lib/three.min.js?v=7110"></script>
<script src="js/config.js?v=7110"></script>
<script src="js/util.js?v=7110"></script>
<script src="js/sprites.js?v=7110"></script>
<script src="js/audio.js?v=7110"></script>
<script src="js/world.js?v=7110"></script>
<script src="js/animals.js?v=7110"></script>
<script src="js/staff.js?v=7110"></script>
<script src="js/economy.js?v=7110"></script>
<script src="js/visitors.js?v=7110"></script>
<script src="js/render.js?v=7110"></script>
<script src="js/models3d.js?v=7110"></script>
<script src="js/render3d.js?v=7110"></script>
<script src="js/input.js?v=7110"></script>
<script src="js/sim.js?v=7110"></script>
<script src="js/save.js?v=7110"></script>
<script src="js/ui.js?v=7110"></script>
<script src="js/main.js?v=7110"></script>
<script>
/* Site: instalável e offline (PWA). No app de computador nada disso é necessário. */
if (!window.faunoDesktop && /^https?:$/.test(location.protocol)){
  document.getElementById('menu-download').style.display = '';
  if ('serviceWorker' in navigator && location.hostname !== 'localhost') navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
