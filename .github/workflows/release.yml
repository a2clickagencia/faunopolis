# Gera o instalador do Windows e publica numa "Release" do GitHub
# sempre que uma tag de versão for enviada (ex.: git tag v7.2.0 && git push --tags)
name: Instalador Windows
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --foreground-scripts
      - run: npm run dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Faunopolis-Setup*.exe
          generate_release_notes: true
